<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Special One ❤️</title>
    <style>
        :root {
            --bg-color: #ffe6eb;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --accent-color: #ff4d6d;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #ff758f;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Tahoma', sans-serif;
            transition: all 0.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 99;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            color: var(--text-color);
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-top: 40px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .timer-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .timer {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .time-unit {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            margin: 10px 5px;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .secret-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            animation: fadeIn 0.8s ease-in-out;
        }

        .reason-box {
            font-size: 1.1rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 / ☀️ เปลี่ยนธีม</button>

    <div class="container">
        <h1>💖 To My Favorite Person 💖</h1>
        <p>ยินดีต้อนรับสู่พื้นที่ส่วนตัวของเราสองคนนะ</p>


        <!-- ปุ่มป๊อบอัพเหตุผลที่รัก -->
        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="showReason()">🎲 กดสุ่มเหตุผลที่รักเธอ</button>
            <div class="reason-box" id="reasonDisplay">กดปุ่มข้างบนสิ มีอะไรจะบอก...</div>
        </div>

        <!-- ปุ่มเปิดการ์ดความลับ -->
        <button class="btn" onclick="revealSecret()" style="background-color: #ff758f;">💌 คลิกเพื่อเปิดการ์ดเซอร์ไพรส์</button>

        <div class="secret-card" id="secretCard">
            <h2>สุขสันต์วันเกิดค้าบบ 🎂🎈</h2>
            <p id="H.B.D 🎂🎈 สุขสันต์วันเกิดนะจ๊ะคนฉวยย ขอให้สุขภาพร่างกายแข็งแฮ้งงง! ยิ้มเย้อะๆ เวลาเค้าเห็นแฟนร่าเริงเค้าก็สนุกร่าเริงเหมือนกะแฟนน อวยพรฉบับคนอวยพรไม่เป็น5555"></p>
        </div>
    </div>

    <script>
        // 1. ใส่วันที่เริ่มคบกันตรงนี้ (ปี-เดือน-วันTเวลา)
        const startDate = new Date("2026-05-20T00:00:00"); 

        // 2. ใส่รายการเหตุผลที่รัก
        const reasons = [
            "สุขล้นๆไม่มีทุกข์ 🤭 ",
            "ร่างกายแข็งแรงสามารถยกรถได้ 💪 ",
            "ไม่มีคนเกลียดชัง มีแต่คนรัก 🌟",
            "เฮงๆรวยๆ คนสวยของเค้า :> 😜",
            "คุณสวยที่สุดในจักรวาลเยยย 🥰"
        ];

        // 3. ข้อความพิมพ์ทีละตัวในการ์ดลับ
        const loveLetter = "ขอบคุณที่ก้าวเข้ามาในชีวิตเค้าน้าแฟนน อยากให้อยู่เป็นความสดใส เป็นรอยยิ้ม และเป็นความสุขให้กันแบบนี้ไปนานๆแส๊นนานเยยย รักแฟนที่สุดในจักรยานล้านโลกเลยน๊ะจ๊ะ มั้วววว ❤️✨";

        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // ระบบสุ่มเหตุผล
        function showReason() {
            const randomIndex = Math.floor(Math.random() * reasons.length);
            document.getElementById("reasonDisplay").innerText = `"${reasons[randomIndex]}"`;
            createHeart();
        }

        // ระบบเปิดข้อความลับ + พิมพ์ทีละตัว
        let isTyped = false;
        function revealSecret() {
            const card = document.getElementById("secretCard");
            card.style.display = "block";
            triggerFireworks();
            
            if (!isTyped) {
                isTyped = true;
                let index = 0;
                const speed = 50;
                function typeWriter() {
                    if (index < loveLetter.length) {
                        document.getElementById("typedText").innerHTML += loveLetter.charAt(index);
                        index++;
                        setTimeout(typeWriter, speed);
                    }
                }
                typeWriter();
            }
        }

        // สลับธีม มืด/สว่าง
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
        }

        // เอฟเฟกต์เค้กลอย
        function createHeart() {
            const cake = document.createElement("div");
            cake.innerHTML = "🎂";
            cake.style.position = "fixed";
            cake.style.left = Math.random() * 100 + "vw";
            cake.style.bottom = "0";
            cake.style.fontSize = Math.random() * 20 + 20 + "px";
            cake.style.animation = "float 3s linear forwards";
            cake.style.opacity = "1";
            document.body.appendChild(heart);

            setTimeout(() => { cake.remove(); }, 3000);
        }

        // เอฟเฟกต์พลุ/ดอกไม้ไฟ (Canvas)
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        function triggerFireworks() {
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    dx: (Math.random() - 0.5) * 10,
                    dy: (Math.random() - 0.5) * 10,
                    size: Math.random() * 5 + 2,
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                    alpha: 1
                });
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.dx;
                p.y += p.dy;
                p.alpha -= 0.01;
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                if (p.alpha <= 0) particles.splice(index, 1);
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
  </html>
